name: Metrics

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Phoenix500526
          filename: metrics-main.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          repositories: 200
          repositories_batch: 50
          base_indepth: yes

  metrics-lang-notable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Phoenix500526
          base: ""
          filename: metrics-lang-notable.svg
          template: classic
          repositories: 200
          repositories_batch: 50
          plugin_languages: yes
          plugin_languages_ignored: CMake, HTML, CSS, QML, QMake, NSIS, Makefile, PowerShell, NASL, Jupyter Notebook
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: programming
          plugin_notable: yes
          plugin_notable_filter: stars:>200 forks:>50
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_skipped: ""
          plugin_notable_indepth: no
